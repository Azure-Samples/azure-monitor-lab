# AKS auto-instrumentation demo (Node.js, Azure Monitor OpenTelemetry distro)
#
# Why this exists:
#   The existing 04-otel-caller.yaml shows Python OTel against the App Service.
#   This file adds a **Node.js** sibling that uses the official
#   `@azure/monitor-opentelemetry` GA package — single import, automatic
#   instrumentation of HTTP/Express/MongoDB/etc., no manual SDK plumbing.
#
#   The Application Map in App Insights now shows:  loadgen (k6) → App Service
#                                                   otel-caller (Python)   → App Service
#                                                   nodeapp-otel (Node)    → App Service
#
# Substitutions handled by scripts/post-deploy.ps1:
#   __APP_SERVICE_URL__   — full URL incl. https://
#   __APPI_CONN_STR__     — App Insights connection string

apiVersion: v1
kind: ConfigMap
metadata:
  name: nodeapp-otel-src
  namespace: demo
data:
  package.json: |
    {
      "name": "amlab-nodeapp-otel",
      "version": "1.0.0",
      "private": true,
      "dependencies": {
        "@azure/monitor-opentelemetry": "1.20.1",
        "express": "4.22.3",
        "axios": "1.21.0"
      }
    }
  app.js: |
    // Single-line opt-in: enable Azure Monitor + auto-instrumentation BEFORE
    // any other module is loaded. Connection string and resource attributes
    // (OTEL_RESOURCE_ATTRIBUTES) are read from env.
    const { useAzureMonitor } = require("@azure/monitor-opentelemetry");
    useAzureMonitor({
      azureMonitorExporterOptions: {
        connectionString: process.env.APPLICATIONINSIGHTS_CONNECTION_STRING,
      },
      samplingRatio: 1.0,
      enableLiveMetrics: true,
    });

    const express = require("express");
    const axios   = require("axios");

    const TARGET = (process.env.APP_SERVICE_URL || "").replace(/\/$/, "");
    const PATHS  = [
      { p: "/",            w: 0.55 },
      { p: "/api/slow",    w: 0.20 },
      { p: "/api/dep",     w: 0.15 },
      { p: "/api/checkout",w: 0.10 },   // hits the new custom-metric endpoint
    ];

    function pickPath() {
      const r = Math.random();
      let cum = 0;
      for (const x of PATHS) { cum += x.w; if (r <= cum) return x.p; }
      return PATHS[0].p;
    }

    async function backgroundCaller() {
      while (true) {
        const path = pickPath();
        const url  = TARGET + path;
        try {
          const resp = await axios.get(url, { timeout: 15000, validateStatus: () => true });
          console.log("call", url, "->", resp.status);
        } catch (err) {
          console.warn("call failed", url, err.message);
        }
        await new Promise(r => setTimeout(r, 2500 + Math.random() * 3000));
      }
    }
    backgroundCaller();

    const app = express();
    app.get("/healthz", (_, res) => res.send("OK"));
    app.get("/", (_, res) => res.json({
      service: "nodeapp-otel-aks",
      target: TARGET,
      note: "Distributed tracing demo — Node.js, codeless OTel via @azure/monitor-opentelemetry."
    }));
    app.listen(8080, () => console.log("listening on 8080, target=", TARGET));

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp-otel
  namespace: demo
  labels:
    app: nodeapp-otel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodeapp-otel
  template:
    metadata:
      labels:
        app: nodeapp-otel
    spec:
      containers:
        - name: app
          image: node:22-alpine
          workingDir: /app
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              mkdir -p /app && cd /app
              cp /src/package.json . && cp /src/app.js .
              # Use npm with reduced verbosity to avoid noisy logs.
              npm install --omit=dev --no-audit --no-fund --silent
              exec node app.js
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: "__APPI_CONN_STR__"
            - name: APP_SERVICE_URL
              value: "__APP_SERVICE_URL__"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=nodeapp-otel-aks,service.namespace=demo,deployment.environment=lab"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: src
              mountPath: /src
      volumes:
        - name: src
          configMap:
            name: nodeapp-otel-src
