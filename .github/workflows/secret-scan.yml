name: secret-scan

# Fails the build if a real secret or real Azure identifier is ever committed.
# This is a lightweight regex guard on top of GitHub's own push protection —
# it catches the patterns this repo specifically must never contain.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test scanner guardrails
        run: node --test .github/scripts/secret-scan.test.cjs

      - name: Scan tracked files for secrets and real identifiers
        shell: bash
        run: |
          set -uo pipefail

          # All tracked files are scanned. Placeholders are allowed:
          #   - <ANGLE-BRACKET> tokens
          #   - the all-zeros GUID 00000000-0000-0000-0000-000000000000
          #   - Microsoft's fictitious sample domains (example.*, contoso.com, fabrikam.com)
          # Well-known public Azure role/policy GUIDs (e.g. Contributor
          # b24988ac-...) are intentionally NOT flagged — only GUIDs that appear in
          # a subscription/tenant context are treated as leaks.

          self=':(exclude).github/workflows/secret-scan.yml'
          guid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          fail=0

          # 1. Hardcoded /subscriptions/<real-guid>/ resource paths.
          hits=$(git grep -nIE "/subscriptions/$guid" -- . "$self" \
            | grep -viE '00000000-0000-0000-0000-000000000000' \
            | grep -vE '<[^>]*>' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded subscription resource ID. Use a parameter/variable or a <YOUR-SUBSCRIPTION-ID> placeholder."
            echo "$hits"; fail=1
          fi

          # 2. subscriptionId / tenantId assigned a real (non-placeholder) GUID.
          hits=$(git grep -nIE "(subscriptionId|tenantId|subscription_id|tenant_id|expectedSubscriptionId|expectedTenantId)" -- . "$self" \
            | grep -iE "$guid" \
            | grep -viE '00000000-0000-0000-0000-000000000000' \
            | grep -vE '<[^>]*>' || true)
          if [ -n "$hits" ]; then
            echo "::error::Real subscription/tenant ID assigned in a tracked file. Move it to gitignored lab.config.json."
            echo "$hits"; fail=1
          fi

          # 3. Inline credential assignments with a real-looking value.
          # App Service's documented built-in SSH password is a public default,
          # usable here only through the authenticated loopback tunnel. Exempt
          # only this exact call; other credentials in the same file still fail.
          hits=$(git grep -nIE '(password|passwd|pwd|secret|client_secret|apikey|api_key|access_key|account_key)[[:space:]]*[:=][[:space:]]*["'\''][^<"'\'' ]{6,}["'\'']' -- . "$self" \
            | grep -vE '^scripts/customer-sql-bootstrap/bootstrap-over-ssh.py:[0-9]+:[[:space:]]*client\.connect\("127\.0\.0\.1", port=port, username="root", password="Docker!",$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded password/secret/key with a real value."
            echo "$hits"; fail=1
          fi

          # 4. Azure connection strings / instrumentation keys.
          # Match literal values, not empty parser tokens or ARM format slots.
          # This still catches a literal key embedded in an ARM expression.
          hits=$(git grep -nIE "(InstrumentationKey=$guid|AccountKey=[A-Za-z0-9+/]{6,}={0,2}|SharedAccessKey=[A-Za-z0-9+/]{6,}={0,2})" -- . "$self" || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible connection string or instrumentation key."
            echo "$hits"; fail=1
          fi

          # 5. Private key material.
          hits=$(git grep -nIE 'BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY' -- . "$self" || true)
          if [ -n "$hits" ]; then
            echo "::error::Private key material committed."
            echo "$hits"; fail=1
          fi

          # 6. Non-fictitious email addresses (allow example.*, contoso.com, fabrikam.com).
          hits=$(git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . "$self" \
            | grep -viE '@(example\.(com|org|net)|contoso\.com|fabrikam\.com|adventure-works\.com)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible real email address. Use a fictitious domain (example.com / contoso.com)."
            echo "$hits"; fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Secret scan FAILED. Remove the offending value, use a gitignored config/placeholder, and amend the commit."
            exit 1
          fi

          echo "Secret scan passed — no real secrets or identifiers detected."

      - name: Verify secret config files are not tracked
        shell: bash
        run: |
          set -uo pipefail
          tracked_bad=$(git ls-files -- \
            'lab.config.json' \
            '.azure-target.json' \
            '**/main.parameters.json' \
            '**/*.tfvars' \
            '**/*.tfstate' \
            '**/*.tfstate.*' \
            '**/.rbac-demo-config.json' \
            '**/*.log' || true)
          # Allow the example/template variants only.
          tracked_bad=$(echo "$tracked_bad" | grep -vE '\.(example|template)$' | grep -vE '\.example\.|\.template\.' || true)
          if [ -n "$tracked_bad" ]; then
            echo "::error::A per-user secret/config file is tracked in git. These must stay gitignored:"
            echo "$tracked_bad"
            exit 1
          fi
          echo "No secret config files are tracked."
